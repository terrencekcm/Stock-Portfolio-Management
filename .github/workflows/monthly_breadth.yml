name: Monthly Market Breadth Run

on:
  # 設定排程：每月 1 號 UTC 時間 00:00 (相當於香港時間早上 8:00) 自動執行
  schedule:
    - cron: '0 0 1 * *'
  
  # 允許你隨時在 GitHub 網頁版手動點擊「Run workflow」測試執行
  workflow_dispatch:

jobs:
  run-monthly-breadth:
    runs-on: ubuntu-latest

    steps:
    # 1. 下載儲存庫程式碼
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安裝必要套件
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 執行 Python 腳本
    - name: Run Market Breadth Script
      run: |
        python script.py
