name: Market Breadth Run

on:
  # 1. 手動觸發：允許在 GitHub 網頁版自訂開始與結束日期
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期 (YYYY-MM-DD，留空則自動計算上一週)'
        required: false
        default: ''
      end_date:
        description: '結束日期 (YYYY-MM-DD，留空則自動計算上一週)'
        required: false
        default: ''

  # 2. 自動排程：每週六 00:00 UTC (香港時間週六 08:00，美股週五收盤後)
  schedule:
    - cron: '0 0 * * 6'

jobs:
  run-market-breadth:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 執行 Python 1，並傳入網頁輸入的 start_date 與 end_date 變數
    - name: Run Python 1 (Large Cap & Tech)
      run: |
        python market_breadth_SP500_NAS100.py --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"

    # 執行 Python 2，並傳入網頁輸入的 start_date 與 end_date 變數
    - name: Run Python 2 (Russell 2000)
      run: |
        python market_breadth_Russell2000.py --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"
