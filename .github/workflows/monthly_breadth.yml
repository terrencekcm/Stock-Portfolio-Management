name: Monthly Market Breadth Run

on:
  schedule:
    # 每月 1 號 UTC 00:00 (香港時間早上 8:00) 自動執行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 允許網頁手動點擊執行

jobs:
  run-monthly-breadth:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. 執行 Python 1 (S&P 500 + Nasdaq 100)
    - name: Run Python 1 (Large Cap & Tech)
      run: |
        python market_breadth_SP500_NAS100.py

    # 2. 執行 Python 2 (Russell 2000)
    - name: Run Python 2 (Russell 2000 Small Cap)
      run: |
        python market_breadth_Russell2000.py
