name: Run Macro Indicators Report

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期 (YYYY-MM-DD)'
        required: false
        default: '2026-01-01'
      end_date:
        description: '結束日期 (YYYY-MM-DD，留空則自動為今天)'
        required: false
        default: ''
  schedule:
    - cron: '0 21 * * 5' # 每週五美股收盤後自動執行

jobs:
  run-macro-check:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-spec@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance pandas_datareader requests

    - name: Run Macro Indicators Script
      run: |
        python macro_indicators.py --start_date "${{ github.event.inputs.start_date }}" --end_date "${{ github.event.inputs.end_date }}"
